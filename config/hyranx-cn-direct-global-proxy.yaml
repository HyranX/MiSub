mode: rule
log-level: info

# MiSub injects the current subscription nodes into this profile at generation time.
# Non-China traffic uses Singapore failover by default. ALL-NODES remains an
# explicit manual override when an exit in another region is required.
proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - SG-FAILOVER
      - SG-MANUAL
      - ALL-NODES
    default-selected: SG-FAILOVER

  # Default: retain the current Singapore exit until it fails, then move to
  # the first healthy Singapore candidate. It never selects by lowest latency.
  - name: SG-FAILOVER
    type: fallback
    include-all: true
    exclude-type: direct
    filter: '(?i)(新加坡|singapore|🇸🇬)'
    url: https://www.gstatic.com/generate_204
    interval: 1800
    timeout: 5000
    max-failed-times: 3
    lazy: true

  # Optional override: use only when you intentionally want to pin one
  # Singapore node and accept manual recovery if that node fails.
  - name: SG-MANUAL
    type: select
    include-all: true
    exclude-type: direct
    filter: '(?i)(新加坡|singapore|🇸🇬)'

  # Manual escape hatch: select this group from PROXY, then choose any
  # imported node. The default route remains SG-FAILOVER.
  - name: ALL-NODES
    type: select
    include-all: true
    exclude-type: direct

rule-providers:
  private-network:
    type: http
    behavior: classical
    format: text
    path: ./ruleset/private-network.list
    url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/433381ebc4b1de59350fa8bed2a04a888228f801/Clash/LocalAreaNetwork.list
    interval: 86400

  china-domain:
    type: http
    behavior: classical
    format: text
    path: ./ruleset/china-domain.list
    url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/433381ebc4b1de59350fa8bed2a04a888228f801/Clash/ChinaDomain.list
    interval: 86400

rules:
  # Keep Tailnet traffic out of the system HTTP proxy and Mihomo proxy nodes.
  # These rules must remain above the generic private/China rules and MATCH.
  - DOMAIN-SUFFIX,tailae5ed6.ts.net,DIRECT
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR6,fd7a:115c:a1e0::/48,DIRECT,no-resolve
  - RULE-SET,private-network,DIRECT
  - RULE-SET,china-domain,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,PROXY
